name: Release & Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Cut Release, Tag & Update Changelog
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate SemVer bump, CHANGELOG.md and Git Tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx commit-and-tag-version -m "chore(release): {{currentTag}} [skip ci]"
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Push release commit and tag to main
        run: git push --follow-tags origin main

      - name: Sync release commit and CHANGELOG back to develop
        run: |
          git fetch origin develop:develop
          git checkout develop
          git merge main --no-edit
          git push origin develop

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --generate-notes
